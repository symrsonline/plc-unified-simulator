name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Release Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore PLCUnifiedSimulator.sln
    
    - name: Build Release
      run: dotnet build PLCUnifiedSimulator.sln --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test PLCUnifiedSimulator.sln --configuration Release --no-build --verbosity normal
    
    - name: Create release packages
      run: |
        # Windows x64
        dotnet publish src/PLCUnifiedSimulator.Console/PLCUnifiedSimulator.Console.csproj \
          --configuration Release \
          --runtime win-x64 \
          --self-contained true \
          --output ./release/win-x64 \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=true
        
        # Linux x64
        dotnet publish src/PLCUnifiedSimulator.Console/PLCUnifiedSimulator.Console.csproj \
          --configuration Release \
          --runtime linux-x64 \
          --self-contained true \
          --output ./release/linux-x64 \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=true
    
    - name: Create archives
      run: |
        cd ./release
        
        # Windows
        zip -r plc-unified-simulator-win-x64.zip win-x64/
        
        # Linux
        tar -czf plc-unified-simulator-linux-x64.tar.gz linux-x64/
        
        # Framework-dependent
        dotnet publish ../src/PLCUnifiedSimulator.Console/PLCUnifiedSimulator.Console.csproj \
          --configuration Release \
          --output ./framework-dependent \
          --no-self-contained
        
        zip -r plc-unified-simulator-framework-dependent.zip framework-dependent/
    
    - name: Upload Release Assets
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./release/plc-unified-simulator-win-x64.zip
          ./release/plc-unified-simulator-linux-x64.tar.gz
          ./release/plc-unified-simulator-framework-dependent.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload all artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-packages
        path: ./release/*.{zip,tar.gz}
        retention-days: 90

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max