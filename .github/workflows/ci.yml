name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore PLCUnifiedSimulator.sln
    
    - name: Build
      run: dotnet build PLCUnifiedSimulator.sln --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test PLCUnifiedSimulator.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage --settings CodeCoverage.runsettings
    
    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v4
      with:
        directory: ./coverage
        fail_ci_if_error: true
        verbose: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore PLCUnifiedSimulator.sln
    
    - name: Build Release
      run: dotnet build PLCUnifiedSimulator.sln --configuration Release --no-restore
    
    - name: Publish Console Application
      run: |
        dotnet publish src/PLCUnifiedSimulator.Console/PLCUnifiedSimulator.Console.csproj \
          --configuration Release \
          --output ./publish/console \
          --no-restore \
          --self-contained false
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: plc-unified-simulator-${{ github.sha }}
        path: ./publish/
        retention-days: 30

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore PLCUnifiedSimulator.sln
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
    
    - name: Build for CodeQL Analysis
      run: dotnet build PLCUnifiedSimulator.sln --configuration Release --no-restore
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore PLCUnifiedSimulator.sln
    
    - name: Check formatting
      run: dotnet format PLCUnifiedSimulator.sln --verify-no-changes --verbosity normal
    
    - name: Run static analysis (if enabled)
      run: |
        dotnet build PLCUnifiedSimulator.sln --configuration Release --verbosity normal
      continue-on-error: true

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore PLCUnifiedSimulator.sln
    
    - name: Build
      run: dotnet build PLCUnifiedSimulator.sln --configuration Release --no-restore
    
    - name: Run Performance Tests
      run: |
        echo "Starting performance test..."
        # Simple performance test - verify application starts quickly
        time timeout 10s dotnet run --project src/PLCUnifiedSimulator.Console --configuration Release < /dev/null || true
        echo "Performance test completed"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore PLCUnifiedSimulator.sln
    
    - name: Build
      run: dotnet build PLCUnifiedSimulator.sln --configuration Release --no-restore
    
    - name: Integration Test
      run: |
        echo "Starting integration test..."
        # Simple integration test - verify application starts
        timeout 5s dotnet run --project src/PLCUnifiedSimulator.Console --configuration Release < /dev/null || true
        echo "Integration test completed successfully"