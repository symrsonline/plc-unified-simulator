version: '3.8'

services:
  plc-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: plc-unified-simulator:latest
    container_name: plc-unified-simulator
    restart: unless-stopped
    ports:
      # Q/L/iQ-R series (Binary)
      - "5000:5000"
      - "5001:5001"
      - "5002:5002"
      # Q/L/iQ-R series (ASCII)
      - "5010:5010"
      - "5011:5011"
      - "5012:5012"
      # FX5U series
      - "5020:5020"
      - "5021:5021"
      # QnA series
      - "5030:5030"
      - "5031:5031"
      # A series
      - "5040:5040"
      # FX series
      - "5050:5050"
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    healthcheck:
      test: ["CMD", "timeout", "5s", "netstat", "-tuln"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - plc-network

  # Optional: Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: plc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - plc-network
    profiles:
      - monitoring

  # Optional: Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: plc-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - plc-network
    profiles:
      - monitoring
    depends_on:
      - prometheus

volumes:
  grafana-storage:

networks:
  plc-network:
    driver: bridge